[server]
# No auth: keep the app on this machine. Set to 0.0.0.0 to share on a LAN.
address = "localhost"
maxUploadSize = 200
maxMessageSize = 200
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[theme]
primaryColor     = "#00D4FF"
backgroundColor  = "#060A14"
secondaryBackgroundColor = "#080D1A"
textColor        = "#C8DCF0"
font             = "sans serif"
