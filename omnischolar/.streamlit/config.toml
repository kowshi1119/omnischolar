[server]
# No auth: keep the app on this machine. Set to 0.0.0.0 to share on a LAN.
address = "localhost"
maxUploadSize = 200
maxMessageSize = 200
enableXsrfProtection = true
# Serves ./static at /app/static (fonts are vendored there for offline use)
enableStaticServing = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[theme]
base             = "dark"
primaryColor     = "#00B4A6"
backgroundColor  = "#060A14"
secondaryBackgroundColor = "#0D1B2A"
textColor        = "#F0F4F8"
# Sinhala/Tamil faces as fallbacks so mixed-script text renders
font             = "DM Sans, Noto Sans Sinhala, Noto Sans Tamil, sans-serif"
headingFont      = "DM Sans, Noto Sans Sinhala, Noto Sans Tamil, sans-serif"
codeFont         = "JetBrains Mono, monospace"
baseRadius       = "10px"

[[theme.fontFaces]]
family = "DM Sans"
url    = "app/static/fonts/dm-sans-latin-300-normal.woff2"
weight = 300

[[theme.fontFaces]]
family = "DM Sans"
url    = "app/static/fonts/dm-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "DM Sans"
url    = "app/static/fonts/dm-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "DM Sans"
url    = "app/static/fonts/dm-sans-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "JetBrains Mono"
url    = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
url    = "app/static/fonts/jetbrains-mono-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
